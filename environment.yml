# Conda environment for the Lim Lab website build toolchain.
# Recreate with: ./config_conda_env.sh
# Or manually:    conda env create -f environment.yml -v

name: limlab-website

channels:
  - nodefaults
  - conda-forge

dependencies:
  - nodejs=22  # LTS; newer majors may break ancient grunt plugins
  - ruby       # not currently used by the build, retained for helper scripts
